input_path: examples/mock_candidates.jsonl
output_dir: outputs/mock_run
random_seed: 17
pair_mode: axis_aligned
top_k: 5
binary_success_threshold: 0.1
failure_thresholds:
  f1: 0.1
  f2: 0.1
  f3: 0.1
calibration:
  default_tier: 2
pair_mining:
  main_axis_threshold: 0.3
  other_axis_threshold: 0.15
  atom_count_tolerance: 0.2
  min_pair_quality: 0.05
  require_prototype_match: true
  require_space_group_match: false
  require_composition_family_match: false
weighted_sum_weights:
  f1: 1.0
  f2: 1.0
  f3: 1.0
ranking:
  mode: utility
  allow_invalid: false
  weights:
    success: 0.4
    confidence: 0.2
    validity: 0.15
    novelty: 0.15
    diversity: 0.1
    cost: 0.05
output_options:
  write_intermediates: true
  write_report: true
